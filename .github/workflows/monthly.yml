name: Monthly Traffic Pipeline

on:
  schedule:
    # 1st of every month, 6:00 AM IST (00:30 UTC)
    - cron: "30 0 1 * *"
  workflow_dispatch:  # Manual trigger for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Increased to 6 hours for 5-pass logic
    
    steps:
      # ── Setup ──────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Google Chrome
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo wget -qO /etc/apt/keyrings/google-chrome.asc https://dl.google.com/linux/linux_signing_key.pub
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.asc] https://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq google-chrome-stable
          google-chrome --version

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── Run Pipeline ───────────────────────────────────────────────────────
      - name: Run Traffic Pipeline
        env:
          SF_USERNAME:        ${{ secrets.SF_USERNAME }}
          SF_PASSWORD:        ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN:  ${{ secrets.SF_SECURITY_TOKEN }}
          SF_DOMAIN:          ${{ secrets.SF_DOMAIN }}
          SLACK_WEBHOOK_URL:  ${{ secrets.SLACK_WEBHOOK_URL }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL:       ${{ secrets.REPORT_EMAIL }}
        run: python main.py

      # ── Upload run artifacts ────────────────────────────────────────────────
      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-${{ github.run_number }}
          path: |
            runs/
            pipeline.log
          retention-days: 30
